<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Weatherly</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
  <header><div class="brand">☀ <span>weatherly</span></div><div class="tag">LIVE WEATHER</div></header>
  <section class="search"><input id="city" placeholder="Search city (e.g. Bishkek)" value="Bishkek"><button id="search">Search ↗</button></section>
  <section class="regions" aria-labelledby="regions-title">
    <h2 id="regions-title">Области Кыргызстана</h2>
    <div id="regions" class="regions-grid" aria-live="polite"></div>
  </section>
  <section class="hero" id="hero"><div><p class="eyebrow" id="date">TODAY</p><h1 id="place">Bishkek, KG</h1><div class="temp"><span id="temp">—</span><sup>°C</sup></div><p id="desc">Getting weather...</p><div class="stats"><div><small>FEELS LIKE</small><b id="feels">—°</b></div><div><small>HUMIDITY</small><b id="humidity">—%</b></div><div><small>WIND</small><b id="wind">— km/h</b></div></div></div><div class="sun" id="icon">☀️</div></section>
  <section class="forecast"><h2>5-day forecast</h2><div id="days" class="days"></div></section>
  <footer>Weather data by Open-Meteo · Made with g☁️</footer>
</main><script src="script.js"></script></body></html>
